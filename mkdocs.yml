site_name: Linxira OS Wiki
site_description: Linxira OS 官方文档 — 仅记录 Linxira 独有特性
site_url: https://linxira-os.github.io/linxira-wiki/

theme:
  name: material
  custom_dir: overrides
  language: zh
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: purple
      toggle:
        icon: material/brightness-7
        name: 切换到深色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: purple
      toggle:
        icon: material/brightness-4
        name: 切换到浅色模式
  features:
    - announce.dismiss
    - navigation.sections
    - navigation.expand
    - content.code.copy

repo_url: https://github.com/Linxira-OS/linxira-wiki
repo_name: Linxira-OS/linxira-wiki

nav:
  - 首页: index.md
  - 项目总览:
      - 索引: 项目总览/index.md
      - 系统入口:
          - Config CLI: 项目总览/linxira-config.md
          - Components: 项目总览/linxira-components.md
          - 欢迎中心: 项目总览/linxira-welcome.md
          - 更新助手: 项目总览/linxira-update.md
          - 恢复诊断: 项目总览/linxira-recovery.md
          - 崩溃监视: 项目总览/linxira-crash-watch.md
          - 工作区守护: 项目总览/workspace-guard.md
      - 软件管理:
          - Package Center: 项目总览/linxira-package-center.md
          - Component Manager: 项目总览/linxira-component-manager.md
          - Completion Agent: 项目总览/linxira-completion-agent.md
          - Gaming Manager: 项目总览/linxira-gaming-manager.md
      - 硬件与内核:
          - HWD Detector: 项目总览/linxira-hwd-detector.md
          - Hardware Driver Manager: 项目总览/linxira-hardware-driver-manager.md
          - Kernel Manager: 项目总览/linxira-kernel-manager.md
      - 数据与签名:
