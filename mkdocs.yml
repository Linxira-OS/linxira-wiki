site_name: Linxira OS Wiki
site_description: Linxira OS 官方文档 — 仅记录 Linxira 独有特性
site_url: https://linxira-os.github.io/linxira-wiki/

theme:
  name: material
  custom_dir: overrides
  language: zh
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: purple
      toggle:
        icon: material/brightness-7
        name: 切换到深色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: purple
      toggle:
        icon: material/brightness-4
        name: 切换到浅色模式
  features:
    - announce.dismiss
    - navigation.sections
    - navigation.expand
    - content.code.copy

repo_url: https://github.com/Linxira-OS/linxira-wiki
repo_name: Linxira-OS/linxira-wiki

nav:
  - 首页: index.md
  - 项目总览:
      - 索引: 项目总览/index.md
      - Config CLI: 项目总览/linxira-config.md
      - Components: 项目总览/linxira-components.md
      - 更新助手: 项目总览/linxira-update.md
      - 恢复诊断: 项目总览/linxira-recovery.md
      - 崩溃监视: 项目总览/linxira-crash-watch.md
      - 工作区守护: 项目总览/workspace-guard.md
      - Agent 工作区: 项目总览/agent-workspace.md
      - Agent 技能: 项目总览/agent-skills.md
      - WSL 发行版: 项目总览/linxira-wsl.md
  - Linxira 特性:
    - Direct Arch 架构: Linxira 特性/architecture.md
    - 品牌系统: Linxira 特性/branding.md
    - 配置中心: Linxira 特性/config-hub.md
    - 预装工具: Linxira 特性/preinstalled-tools.md
    - 工作流模板: Linxira 特性/workflows.md
  - 外部链接:
    - Arch Wiki: 外部链接/arch-wiki.md
  - 相关站点:
      - 返回官网: https://linxira-os.github.io/zh/
      - 快速上手（文档站）: https://linxira-os.github.io/zh/docs/
      - 博客: https://linxira-os.github.io/zh/blog/
      - 下载镜像: https://linxira-os.github.io/zh/download/
      - GitHub: https://github.com/Linxira-OS

not_in_nav: |
  /外部链接/debian.md
  /外部链接/mint.md

markdown_extensions:
  - admonition
  - pymdownx.highlight
  - pymdownx.superfences
