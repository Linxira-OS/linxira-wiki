site_name: Linxira OS Wiki
site_description: Linxira OS 官方文档 — 仅记录 Linxira 独有特性
site_url: https://linxira-os.github.io/linxira-wiki/

theme:
  name: material
  custom_dir: overrides
  language: zh
  font: false
  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: 切换到浅色模式
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: 切换到深色模式
  features:
    - announce.dismiss
    - navigation.sections
    - navigation.expand
    - content.code.copy

repo_url: https://github.com/Linxira-OS/linxira-wiki
repo_name: Linxira-OS/linxira-wiki

extra_css:
  - assets/stylesheets/linxira-fonts.css
  - assets/stylesheets/linxira-theme.css
  - assets/stylesheets/linxira-wiki.css

plugins:
  - search
  - redirects:
      redirect_maps:
        "项目总览/agent-skills.md": "software/agent-skills.md"
        "项目总览/agent-workspace.md": "software/agent-workspace.md"
        "项目总览/linxira-bio-sdk.md": "software/bio-sdk.md"
        "项目总览/linxira-catalog.md": "software/catalog.md"
        "项目总览/linxira-completion-agent.md": "software/completion-agent.md"
        "项目总览/linxira-component-manager.md": "software/component-manager.md"
        "项目总览/linxira-components.md": "software/components.md"
        "项目总览/linxira-config.md": "software/config.md"
        "项目总览/linxira-crash-watch.md": "software/crash-watch.md"
        "项目总览/linxira-gaming-manager.md": "software/gaming-manager.md"
        "项目总览/linxira-hardware-driver-manager.md": "software/hardware-driver-manager.md"
        "项目总览/linxira-hwd-detector.md": "software/hwd-detector.md"
        "项目总览/index.md": "software/index.md"
        "项目总览/linxira-kernel-manager.md": "software/kernel-manager.md"
        "项目总览/linxira-keyring.md": "software/keyring.md"
        "项目总览/linxira-package-center.md": "software/package-center.md"
        "项目总览/linxira-recovery.md": "software/recovery.md"
        "项目总览/linxira-update.md": "software/update.md"
        "项目总览/linxira-welcome.md": "software/welcome.md"
        "项目总览/workspace-guard.md": "software/workspace-guard.md"
        "项目总览/linxira-wsl.md": "software/wsl.md"
        "项目总览/linxira-zeta.md": "software/zeta.md"
        "Linxira 特性/architecture.md": "features/architecture.md"
        "Linxira 特性/branding.md": "features/branding.md"
        "Linxira 特性/config-hub.md": "features/config-hub.md"
        "Linxira 特性/preinstalled-tools.md": "features/preinstalled-tools.md"
        "Linxira 特性/workflows.md": "features/workflows.md"
        "外部链接/arch-wiki.md": "external/arch-wiki.md"
        "外部链接/debian.md": "external/debian.md"
        "外部链接/mint.md": "external/mint.md"
        "法律与安全/license.md": "legal/license.md"
        "法律与安全/security.md": "legal/security.md"
  - i18n:
      docs_structure: folder
      fallback_to_default: true
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: zh
          name: 中文
          default: true
          build: true
        - locale: en
          name: English
          build: true
          nav_translations:
            首页: Home
            项目总览: Software
            索引: Index
            系统入口: System entry
            欢迎中心: Welcome
            更新助手: Update
            恢复诊断: Recovery
            崩溃监视: Crash Watch
            工作区守护: Workspace Guard
            软件管理: Software management
            硬件与内核: Hardware and kernel
            数据与签名: Data and signing
            平台与 Agent: Platform and agents
            WSL 发行版: WSL
            Agent 工作区: Agent Workspace
            Agent 技能: Agent Skills
            外部产品: External products
            Linxira 特性: Features
            Direct Arch 架构: Direct Arch Architecture
            品牌系统: Branding
            配置中心: Config Hub
            预装工具: Preinstalled Tools
            工作流模板: Workflows
            外部链接: External
            法律与安全: Legal & Security
            许可与法律: License & Legal
            安全与贡献: Security & Contribution
            相关站点: Related sites
            返回官网: Official site
            快速上手（文档站）: Quick start (docs site)
            博客: Blog
            下载镜像: Download

nav:
  - 首页: index.md
  - 项目总览:
      - 索引: software/index.md
      - 系统入口:
          - Config CLI: software/config.md
          - Components: software/components.md
          - 欢迎中心: software/welcome.md
          - 更新助手: software/update.md
          - 恢复诊断: software/recovery.md
          - 崩溃监视: software/crash-watch.md
          - 工作区守护: software/workspace-guard.md
      - 软件管理:
          - Package Center: software/package-center.md
          - Component Manager: software/component-manager.md
          - Completion Agent: software/completion-agent.md
          - Gaming Manager: software/gaming-manager.md
      - 硬件与内核:
          - HWD Detector: software/hwd-detector.md
          - Hardware Driver Manager: software/hardware-driver-manager.md
          - Kernel Manager: software/kernel-manager.md
      - 数据与签名:
          - Catalog: software/catalog.md
          - Keyring: software/keyring.md
      - 平台与 Agent:
          - WSL 发行版: software/wsl.md
          - Agent 工作区: software/agent-workspace.md
          - Agent 技能: software/agent-skills.md
      - 外部产品:
          - Zeta: software/zeta.md
          - Bio SDK: software/bio-sdk.md
  - Linxira 特性:
      - Direct Arch 架构: features/architecture.md
      - 品牌系统: features/branding.md
      - 配置中心: features/config-hub.md
      - 预装工具: features/preinstalled-tools.md
      - 工作流模板: features/workflows.md
  - 外部链接:
      - Arch Wiki: external/arch-wiki.md
  - 法律与安全:
      - 许可与法律: legal/license.md
      - 安全与贡献: legal/security.md
  - 相关站点:
      - 返回官网: https://linxira-os.github.io/zh/
      - 快速上手（文档站）: https://linxira-os.github.io/zh/docs/
      - 博客: https://linxira-os.github.io/zh/blog/
      - 下载镜像: https://linxira-os.github.io/zh/download/
      - GitHub: https://github.com/Linxira-OS

not_in_nav: |
  /external/debian.md
  /external/mint.md

markdown_extensions:
  - admonition
  - pymdownx.highlight
  - pymdownx.superfences
